<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Block Blast Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <header class="topbar">
      <div class="score-box">
        <span class="label">Punkte</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-box">
        <span class="label">Best</span>
        <span id="best" class="value">0</span>
      </div>
    </header>

    <div class="controls">
      <select id="difficulty" class="ctrl-select" title="Schwierigkeit">
        <option value="easy">Einfach</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Schwer</option>
      </select>
      <button id="undo" class="ctrl-btn" title="Rückgängig" disabled>↩︎ Undo</button>
      <button id="sound" class="ctrl-btn" title="Ton an/aus">🔊</button>
    </div>

    <div id="combo" class="combo"></div>

    <div id="board-wrap">
      <canvas id="board"></canvas>
    </div>

    <div id="tray" class="tray"></div>

    <div id="gameover" class="overlay hidden">
      <div class="overlay-card">
        <h2>Game Over</h2>
        <p>Punkte: <span id="final-score">0</span></p>
        <button id="overlay-restart">Nochmal spielen</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
